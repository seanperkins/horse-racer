version: '3.8'

# Minimal setup - just the database
# Use this if you want to run the app locally but need a quick PostgreSQL instance
# Run with: docker-compose -f docker-compose.db.yml up

services:
  db:
    image: postgres:16-alpine
    container_name: neighs-of-thunder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neighs_of_thunder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
