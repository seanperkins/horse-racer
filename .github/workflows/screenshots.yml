name: PR Screenshots

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  screenshots:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: horse_racer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup environment
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/horse_racer_test" >> $GITHUB_ENV
          echo "NEXTAUTH_SECRET=test-secret-for-screenshots" >> $GITHUB_ENV
          echo "NEXTAUTH_URL=http://localhost:3000" >> $GITHUB_ENV

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Start server
        run: |
          npm run dev &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Take screenshots
        run: |
          mkdir -p screenshots
          npx playwright test --project=screenshots || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: screenshots/
          retention-days: 7

      - name: Comment on PR with screenshots
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const screenshots = fs.readdirSync('screenshots').filter(f => f.endsWith('.png'));

            if (screenshots.length > 0) {
              const body = `## 📸 Mobile Screenshots\n\nScreenshots have been captured for this PR.\n\nDownload from the workflow artifacts to review.`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
