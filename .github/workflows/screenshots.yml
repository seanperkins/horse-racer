name: PR Screenshots

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: horse_racer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install wait-on
        run: npm install -g wait-on

      - name: Setup environment
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/horse_racer_test" >> $GITHUB_ENV
          echo "NEXTAUTH_SECRET=test-secret-for-screenshots" >> $GITHUB_ENV
          echo "NEXTAUTH_URL=http://localhost:3000" >> $GITHUB_ENV

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma db push --accept-data-loss

      - name: Seed test user
        run: npx tsx prisma/seed-test-user.ts

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create directories
        run: |
          mkdir -p screenshots
          mkdir -p playwright/.auth

      - name: Start server
        run: |
          npm run dev &
          echo $! > .server-pid
          wait-on http://localhost:3000 --timeout 60000

      - name: Take screenshots
        run: npx playwright test --project=screenshots

      - name: Stop server
        if: always()
        run: |
          if [ -f .server-pid ]; then
            kill $(cat .server-pid) 2>/dev/null || true
            rm .server-pid
          fi

      - name: Upload screenshots to branch
        if: success() && github.event_name == 'pull_request'
        run: |
          # Save screenshots to temp location first
          mkdir -p /tmp/screenshots-upload
          cp screenshots/*.png /tmp/screenshots-upload/

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create a unique folder for this PR/commit
          SCREENSHOT_DIR="pr-${{ github.event.pull_request.number }}/${{ github.sha }}"

          # Clone the repo fresh for screenshots branch operations
          cd /tmp
          rm -rf screenshots-repo
          git clone --depth 1 https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git screenshots-repo || true
          cd screenshots-repo

          # Configure git in cloned repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Try to checkout screenshots branch, or create orphan
          git fetch origin screenshots:screenshots 2>/dev/null && git checkout screenshots || {
            git checkout --orphan screenshots
            git rm -rf . 2>/dev/null || true
          }

          # Create directory and copy screenshots
          mkdir -p "$SCREENSHOT_DIR"
          cp /tmp/screenshots-upload/*.png "$SCREENSHOT_DIR/"

          # Commit and push
          git add .
          git commit -m "Screenshots for PR #${{ github.event.pull_request.number }} @ ${{ github.sha }}" || echo "No changes to commit"
          git push origin screenshots --force

      - name: Post screenshots to PR
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Screenshots were copied to /tmp/screenshots-upload before git operations
            const screenshotDir = '/tmp/screenshots-upload';
            const files = fs.readdirSync(screenshotDir).filter(f => f.endsWith('.png'));

            if (files.length === 0) {
              console.log('No screenshots found');
              return;
            }

            const sha = context.sha;
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const baseUrl = `https://raw.githubusercontent.com/${owner}/${repo}/screenshots/pr-${prNumber}/${sha}`;

            // Group screenshots by page
            const pages = {};
            for (const file of files) {
              const match = file.match(/^(.+)-(mobile|tablet|desktop)\.png$/);
              if (match) {
                const [, page, viewport] = match;
                if (!pages[page]) pages[page] = {};
                pages[page][viewport] = `${baseUrl}/${file}`;
              }
            }

            // Build markdown comment
            let body = `## 📱 Screenshot Preview\n\n`;
            body += `Screenshots for commit ${sha.substring(0, 7)}\n\n`;

            for (const [page, viewports] of Object.entries(pages)) {
              body += `### ${page.charAt(0).toUpperCase() + page.slice(1).replace(/-/g, ' ')}\n\n`;
              body += `| Mobile (375px) | Tablet (768px) | Desktop (1280px) |\n`;
              body += `|:---:|:---:|:---:|\n`;
              body += `| ${viewports.mobile ? `<img src="${viewports.mobile}" width="200">` : '-'} `;
              body += `| ${viewports.tablet ? `<img src="${viewports.tablet}" width="200">` : '-'} `;
              body += `| ${viewports.desktop ? `<img src="${viewports.desktop}" width="200">` : '-'} |\n\n`;
            }

            // Find existing comment to update
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('## 📱 Screenshot Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body,
              });
              console.log('Updated existing comment');
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              console.log('Created new comment');
            }

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots-${{ github.sha }}
          path: screenshots/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
